[project]
name = "codebase-context-assistant"
version = "0.1.0"
description = "AI-assisted codebase context tool with repo scanning, indexing, drift detection, and grounded developer Q&A."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"